model:
  target_model_path: "/dockerdata/models/Qwen3-4B"
  draft_model_config: "configs/qwen3-4b-dflash.json"
  target_backend: "sglang"
  trust_remote_code: true
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  mask_token_id: 151669
data:
  train_data_path: "/dockerdata/datasets/open-perfectblend/qwen3_4b/perfectblend_train_regen.jsonl"
  max_length: 3072
  chat_template: "qwen"
  build_dataset_num_proc: 32
  cache_dir: "/dockerdata/specforge_cache/qwen3-4b-dflash"
training:
  strategy: "dflash"
  num_epochs: 1
  max_steps: 100
  batch_size: 16
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 1000
  log_interval: 1
  dist_timeout: 600
  seed: 42
runtime:
  producer_lease: 64
  producer_concurrency: 8
  in_flight_high_watermark: 1024
  in_flight_low_watermark: 512
tracking:
  report_to: "wandb"
  wandb_project: "specforge-qwen3-4b-dflash"
  wandb_name: "qwen3-4b-dflash-b16-smoke"
run_id: "qwen3-4b-dflash-b16-smoke"
output_dir: "/dockerdata/specforge_outputs/qwen3-4b-dflash-b16-smoke"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 7
  disaggregated:
    control_dir: /dockerdata/specforge_outputs/qwen3-4b-dflash-b16-smoke/control
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
        - "7"
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 34359738368
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 300000
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          mem_fraction_static: 0.5
