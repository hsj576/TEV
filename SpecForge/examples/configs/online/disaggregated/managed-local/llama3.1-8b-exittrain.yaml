model:
  # Path to the HuggingFace directory of the Llama-3.1-8B-Instruct target.
  target_model_path: "<PATH_TO_TARGET_MODEL>/Llama-3.1-8B-Instruct"
  draft_model_config: "configs/llama3.1-8b-dted.json"
  # Warm-start from a Llama-3.1 DFlash-family checkpoint (dflash / dted /
  # exittrain).
  draft_checkpoint_path: "<PATH_TO_DRAFT_CHECKPOINT>/Llama-3.1-8B-Instruct-DFlash-UltraChat"
  target_backend: "sglang"
  trust_remote_code: true
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  mask_token_id: 128002
data:
  train_data_path: "<PATH_TO_TRAIN_DATA>/llama31_regen/perfectblend_train_regen_llama31_8b.jsonl"
  max_length: 3072
  chat_template: "llama3"
  build_dataset_num_proc: 32
  cache_dir: "<PATH_TO_CACHE>/llama3.1-8b-exittrain"
training:
  # ExitTrain recipe (aligned with the Qwen3-4B/8B recipe): full-tree
  # target verify using a small tree, 32 anchors, 2 epochs.
  #
  # Config:
  #   num_anchors=32
  #   tree_budget=32 (matches inference-time small-tree profile)
  #   num_epochs=2
  strategy: "exittrain"
  num_epochs: 2
  batch_size: 4
  learning_rate: 0.0001
  warmup_ratio: 0.005
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 32
  save_interval: 5000
  log_interval: 10
  dist_timeout: 600
  seed: 42
  # DTED shared knobs (reused verbatim by ExitTrain).
  dted_tree_budget: 32
  dted_alpha: 1.0e-4
  dted_eps: 1.0e-8
  dted_weight_type: "P_tgt"
  dted_ce_weight: 1.0
  dted_reinforce_weight: 0.1
  # ExitTrain-specific knobs.
  exittrain_prefix_window: 64
  exittrain_target_dtype: "bfloat16"
runtime:
  producer_lease: 64
  producer_concurrency: 8
  in_flight_high_watermark: 768
  in_flight_low_watermark: 384
tracking:
  report_to: "swanlab"
  swanlab_project: "specforge-llama3.1-8b-exittrain"
  swanlab_name: "llama3.1-8b-exittrain"
  # Set via the SWANLAB_API_KEY environment variable in your launch script.
run_id: "llama3.1-8b-exittrain"
output_dir: "<PATH_TO_OUTPUT>/llama3.1-8b-exittrain"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 7
  disaggregated:
    control_dir: <PATH_TO_OUTPUT>/llama3.1-8b-exittrain/control
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
        - "7"
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 34359738368
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 300000
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          mem_fraction_static: 0.6
